services:
  # ============================================================================
  # 1. PostgreSQL Relational Metadata Database
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: search_sphere_postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-search_sphere}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-search_sphere}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - search_sphere_network

  # ============================================================================
  # 2. Redis Cache & Data Store
  # ============================================================================
  redis:
    profiles: [legacy]
    image: redis:7-alpine
    container_name: search_sphere_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - search_sphere_network

  # ============================================================================
  # 3. RabbitMQ Message Broker (Dramatiq Queue)
  # ============================================================================
  rabbitmq:
    profiles: [legacy]
    image: rabbitmq:3-management-alpine
    container_name: search_sphere_rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - search_sphere_network

  # ============================================================================
  # 4. Qdrant Vector Database
  # ============================================================================
  qdrant:
    profiles: [legacy]
    image: qdrant/qdrant:v1.11.0
    container_name: search_sphere_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - search_sphere_network

  # ============================================================================
  # 5. FastAPI Backend Service
  # ============================================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: search_sphere_api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/search_sphere}
      DATABASE_URL_SYNC: ${DATABASE_URL_SYNC:-postgresql://postgres:postgres@postgres:5432/search_sphere}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-documents}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/api/auth/callback/google}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/auth/github/callback}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      QUERY_REWRITE_MODEL: ${QUERY_REWRITE_MODEL:-command-a-03-2025}
      RAG_GENERATION_MODEL: ${RAG_GENERATION_MODEL:-command-a-03-2025}
      RUN_INGESTION_WORKER: "false"
    volumes:
      - ./apps/api:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000 --workers 1"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - search_sphere_network

  # ============================================================================
  # 6. Independent PostgreSQL ingestion/cleanup worker (canonical hosted runtime)
  # ============================================================================
  worker:
    build:
      context: ./apps/api
      dockerfile: ../worker/Dockerfile
    container_name: search_sphere_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/search_sphere}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      TIKTOKEN_CACHE_DIR: /opt/tokenizer-cache
    volumes:
      - ./apps/api:/app
    command: python -m src.services.ingestion_worker
    depends_on:
      api:
        condition: service_healthy
    networks:
      - search_sphere_network

  # ============================================================================
  # 7. Next.js Frontend Service
  # ============================================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: search_sphere_web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      INTERNAL_API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:-}
      PORT: 3000
      HOSTNAME: "0.0.0.0"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: pnpm dev
    networks:
      - search_sphere_network

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  qdrant_data:
    driver: local

# ==============================================================================
# Monorepo Bridge Network
# ==============================================================================
networks:
  search_sphere_network:
    driver: bridge
