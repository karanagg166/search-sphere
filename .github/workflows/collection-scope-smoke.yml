name: Authenticated Collection Scope Gate

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full main revision already serving Search Sphere
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: search-sphere-collection-scope-smoke
  cancel-in-progress: false

jobs:
  collection-scope:
    if: github.ref == 'refs/heads/main' && github.repository == 'karanagg166/search-sphere'
    environment: search-sphere-release
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require exact deployed main CI and protected scope fixtures
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_SCOPE_API_KEY: ${{ secrets.RELEASE_SCOPE_API_KEY }}
          PROD_SMOKE_FIXTURE_KEY: ${{ secrets.RELEASE_SMOKE_KEY }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess
          sha = os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'Full main SHA required'
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'], check=True)
          for name in ('RELEASE_SCOPE_API_KEY', 'PROD_SMOKE_FIXTURE_KEY'):
              assert len(os.environ.get(name, '')) >= 32, 'Required protected scope fixture missing'
          value = subprocess.run(['gh', 'api', 'repos/karanagg166/search-sphere/actions/runs?head_sha=' + sha + '&event=push&branch=main&per_page=100'], capture_output=True, text=True, check=True, timeout=30)
          runs = [run for run in json.loads(value.stdout)['workflow_runs'] if run['name'] == 'Search Sphere CI']
          assert runs and runs[0]['status'] == 'completed' and runs[0]['conclusion'] == 'success', 'Exact serving main revision must pass CI'
          PY
      - name: Verify delegated scope and clean up signed empty catalogs
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_SCOPE_API_KEY: ${{ secrets.RELEASE_SCOPE_API_KEY }}
          PROD_SMOKE_FIXTURE_KEY: ${{ secrets.RELEASE_SMOKE_KEY }}
        run: python scripts/collection_scope_smoke.py
