name: Keep Render Backend Awake

on:
  schedule:
    # Run every 14 minutes to prevent Render 15-minute inactivity spin-down
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Health Endpoint
        env:
          BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          TARGET_URL="${BACKEND_URL:-https://search-sphere-api.onrender.com}/health"
          echo "Pinging $TARGET_URL to keep Render container warm..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$TARGET_URL" || echo "000")
          echo "Received HTTP Status: $HTTP_STATUS"
