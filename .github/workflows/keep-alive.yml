name: Multi-Project Backend Health Monitor & Keep-Alive

on:
  schedule:
    # Offset 10-minute cron schedule to keep Render free services awake without colliding on the hour
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch:
    inputs:
      retries:
        description: "Max retry attempts per endpoint"
        required: false
        default: "3"
      timeout:
        description: "Total timeout per attempt (seconds)"
        required: false
        default: "35"
      monitor_search_sphere:
        description: "Monitor Search-Sphere API"
        required: false
        type: boolean
        default: true
      monitor_quick_clinic_socket:
        description: "Monitor Quick-Clinic Socket.IO Server"
        required: false
        type: boolean
        default: true
      monitor_exam_arena:
        description: "Monitor ExamArena API"
        required: false
        type: boolean
        default: true
      monitor_quick_clinic_web:
        description: "Monitor Quick-Clinic Web App"
        required: false
        type: boolean
        default: false

concurrency:
  group: backend-keep-alive-monitoring
  cancel-in-progress: false

jobs:
  monitor-and-keep-alive:
    name: Backend Health & Liveness Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Verify Monitor Integrity & Safety Suite
        run: |
          pytest scripts/tests/test_monitor.py -v

      - name: Execute Multi-Project Keep-Alive Probes
        env:
          SEARCH_SPHERE_API_URL: ${{ secrets.SEARCH_SPHERE_API_URL || 'https://search-sphere-api.onrender.com' }}
          QUICK_CLINIC_SOCKET_URL: ${{ secrets.QUICK_CLINIC_SOCKET_URL || 'https://quickclinic-socket-server.onrender.com' }}
          EXAM_ARENA_API_URL: ${{ secrets.EXAM_ARENA_API_URL || 'https://exam-arena-mu.vercel.app' }}
          QUICK_CLINIC_WEB_URL: ${{ secrets.QUICK_CLINIC_WEB_URL || 'https://quick-clinic-nine.vercel.app' }}
          MONITOR_SEARCH_SPHERE: ${{ github.event.inputs.monitor_search_sphere || 'true' }}
          MONITOR_QUICK_CLINIC_SOCKET: ${{ github.event.inputs.monitor_quick_clinic_socket || 'true' }}
          MONITOR_EXAM_ARENA: ${{ github.event.inputs.monitor_exam_arena || 'true' }}
          MONITOR_QUICK_CLINIC_WEB: ${{ github.event.inputs.monitor_quick_clinic_web || 'false' }}
        run: |
          python scripts/monitor_backends.py \
            --retries "${{ github.event.inputs.retries || '3' }}" \
            --timeout "${{ github.event.inputs.timeout || '35' }}" \
            --backoff 5
