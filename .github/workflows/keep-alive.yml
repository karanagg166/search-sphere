name: Search Sphere Health and Database Activity

on:
  schedule:
    # Budgeted daily database activity check (runs twice daily at 06:00 and 18:00 UTC)
    # Prevents Supabase 7-day inactivity pause while allowing Render free services to
    # sleep naturally when idle, preserving the shared 750 instance-hours/month budget.
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      retries:
        description: "Max retry attempts per endpoint"
        required: false
        default: "3"
      timeout:
        description: "Total timeout per attempt (seconds)"
        required: false
        default: "35"

concurrency:
  group: backend-keep-alive-monitoring
  cancel-in-progress: false

jobs:
  monitor-and-keep-alive:
    name: Backend Health & Liveness Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Install test runner dependencies
        run: |
          uv pip install --system pytest

      - name: Verify Monitor Integrity & Safety Suite
        run: |
          pytest scripts/tests/test_monitor.py -v

      - name: Check standalone Search Sphere health and readiness
        env:
          SEARCH_SPHERE_API_URL: ${{ secrets.SEARCH_SPHERE_API_URL || 'https://search-sphere-api.onrender.com' }}
        run: |
          python scripts/monitor_backends.py \
            --retries "${{ github.event.inputs.retries || '3' }}" \
            --timeout "${{ github.event.inputs.timeout || '35' }}" \
            --backoff 5
