name: Search Sphere Post-Deployment Live Smoke

# Deployment completion, not pre-deployment CI completion, is the prerequisite.
# The release controller dispatches this phase after a pinned deployment succeeds.
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Full main revision already deployed to Render"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: search-sphere-production-smoke
  cancel-in-progress: false

jobs:
  production-smoke:
    name: Authenticated standalone and conversation release journeys
    if: github.ref == 'refs/heads/main'
    environment: search-sphere-release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted main code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate the intended main revision and protected credentials
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PROD_SMOKE_USER_EMAIL: ${{ secrets.RELEASE_SMOKE_EMAIL }}
          PROD_SMOKE_USER_PASSWORD: ${{ secrets.RELEASE_SMOKE_PASSWORD }}
          PROD_SMOKE_FIXTURE_KEY: ${{ secrets.RELEASE_SMOKE_KEY }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          sha = os.environ['EXPECTED_SHA']
          assert re.fullmatch(r'[0-9a-f]{40}', sha), 'Full lowercase release SHA required'
          subprocess.run(['git', 'merge-base', '--is-ancestor', sha, 'HEAD'], check=True)
          for name in ('PROD_SMOKE_USER_EMAIL', 'PROD_SMOKE_USER_PASSWORD', 'PROD_SMOKE_FIXTURE_KEY'):
              assert os.environ.get(name), f'Required protected credential is missing: {name}'
          assert len(os.environ['PROD_SMOKE_FIXTURE_KEY'].encode()) >= 32, 'Fixture key is too short'
          PY

      - name: Verify upload, indexing, standalone/conversation answers, SSE, and cleanup
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          PROD_SMOKE_USER_EMAIL: ${{ secrets.RELEASE_SMOKE_EMAIL }}
          PROD_SMOKE_USER_PASSWORD: ${{ secrets.RELEASE_SMOKE_PASSWORD }}
          PROD_SMOKE_FIXTURE_KEY: ${{ secrets.RELEASE_SMOKE_KEY }}
        run: python3 scripts/ci_production_smoke.py

      - name: Preserve synthetic cleanup receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: standalone-fixture-receipts-${{ github.run_id }}
          path: .ci_smoke_manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
