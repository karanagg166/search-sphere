name: Search Sphere CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: search_sphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements.txt"

      - name: Install system dependencies (Poppler & Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            tesseract-ocr \
            poppler-utils \
            libsm6 \
            libxext6

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -r apps/api/requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff

      - name: Lint with Ruff
        run: |
          ruff check apps/api/src apps/api/tests apps/worker/src apps/worker/tests

      - name: Apply Database Migrations (Alembic)
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/search_sphere_test"
          PYTHONPATH: "."
        run: |
          alembic upgrade head

      - name: Run Backend Unit & Hardening Tests
        env:
          ENVIRONMENT: "test"
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/search_sphere_test"
          JWT_SECRET_KEY: "test-secret-key-32-chars-minimum-length-for-ci"
          COHERE_API_KEY: "test_cohere_key"
          QDRANT_URL: "http://localhost:6333"
          STORAGE_BACKEND: "local"
          LOCAL_STORAGE_DIR: "/tmp/storage"
          PYTHONPATH: "apps/api"
        run: |
          pytest apps/api/tests -v

  frontend-test:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "apps/web/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install

      - name: Lint Frontend
        run: pnpm lint

      - name: Run Frontend Tests
        run: pnpm test

      - name: Build Next.js Web App
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-supabase-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "mock_publishable_key"
        run: pnpm build
