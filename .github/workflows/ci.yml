name: Search Sphere CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: search_sphere_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d search_sphere_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "apps/api/requirements-production.txt"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-production.txt
          pip install pytest pytest-asyncio pytest-cov ruff aiosqlite

      - name: Lint with Ruff
        run: |
          ruff check apps/api/src apps/api/tests apps/worker/src apps/worker/tests

      - name: Apply Database Migrations (Alembic)
        working-directory: apps/api
        env:
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/search_sphere_test"
          PYTHONPATH: "."
        run: |
          alembic upgrade head

      - name: Run Backend Unit & Hardening Tests
        env:
          ENVIRONMENT: "test"
          DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/search_sphere_test"
          JWT_SECRET_KEY: "test-secret-key-32-chars-minimum-length-for-ci"
          COHERE_API_KEY: "test_cohere_key"
          GOOGLE_CLIENT_ID: "mock-google-client-id-for-ci"
          GOOGLE_CLIENT_SECRET: "mock-google-client-secret-for-ci"
          GITHUB_CLIENT_ID: "mock-github-client-id-for-ci"
          GITHUB_CLIENT_SECRET: "mock-github-client-secret-for-ci"
          QDRANT_URL: "http://localhost:6333"
          STORAGE_BACKEND: "local"
          LOCAL_STORAGE_DIR: "/tmp/storage"
          PYTHONPATH: "apps/api"
        run: |
          pytest apps/api/tests -v

      - name: Verify Data API denial against real PostgreSQL
        env:
          SECURITY_TEST_DATABASE_URL: "postgresql://test_user:test_password@localhost:5432/search_sphere_test"
          PYTHONPATH: "apps/api"
        run: pytest scripts/tests/test_data_api_lockdown.py scripts/tests/test_private_document_response.py -v

      - name: Verify durable ingestion concurrency and restart recovery
        env:
          INGESTION_TEST_DATABASE_URL: "postgresql+asyncpg://test_user:test_password@localhost:5432/search_sphere_test"
          PYTHONPATH: "apps/api"
        run: >-
          pytest scripts/tests/test_ingestion_queue_postgres.py
          scripts/tests/test_atomic_reindex_postgres.py
          scripts/tests/test_client_bootstrap_postgres.py
          scripts/tests/test_inference_data_policy_postgres.py
          scripts/tests/test_ingestion_worker_postgres.py
          scripts/tests/test_document_cleanup_postgres.py
          scripts/tests/test_document_evidence_postgres.py
          scripts/tests/test_derived_assets_postgres.py
          scripts/tests/test_query_access_postgres.py
          scripts/tests/test_conversation_context_postgres.py
          scripts/tests/test_delegated_conversations_postgres.py
          scripts/tests/test_versioned_context_postgres.py
          scripts/tests/test_medical_context_postgres.py
          scripts/tests/test_query_routing_postgres.py
          scripts/tests/test_native_streams_postgres.py
          scripts/tests/test_grounded_guardrails_postgres.py
          scripts/tests/test_compact_memory_postgres.py
          scripts/tests/test_retrieval_cache_postgres.py
          scripts/tests/test_document_versions_postgres.py -v

      - name: Verify hosted inference eligibility and bounded failures
        env:
          PYTHONPATH: "apps/api"
        run: pytest scripts/tests/test_cohere_gateway.py scripts/tests/test_hosted_runtime.py scripts/tests/test_hosted_token_limits.py -v

      - name: Run Monitor & Keep-Alive Safety Suite
        env:
          PYTHONPATH: "."
        run: |
          pytest scripts/tests/test_monitor.py scripts/tests/test_ci_production_smoke.py -v

  hosted-runtime-image:
    name: Hosted Runtime Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -t search-sphere-hosted:ci apps/api
      - name: Verify hosted-only image without network access
        run: >-
          docker run --rm --network none --memory 512m
          -e ENVIRONMENT=test -e STORAGE_BACKEND=local
          -e PYTHONPATH=/app
          -e DATABASE_URL=postgresql+asyncpg://synthetic:synthetic@localhost/search_sphere_test
          -v "$PWD/scripts/check_hosted_image.py:/check_hosted_image.py:ro"
          search-sphere-hosted:ci python /check_hosted_image.py

  worker-test:
    name: Worker Ingestion & Extraction Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements-production.txt
      - name: Install canonical hosted runtime and test dependencies
        run: |
          pip install -r apps/api/requirements-production.txt
          pip install pytest pytest-asyncio aiosqlite
      - name: Verify preserved deterministic processing and hosted adapters
        env:
          ENVIRONMENT: test
          PYTHONPATH: apps/api
          DATABASE_URL: sqlite+aiosqlite:////tmp/ss_worker_runtime_test.db
          STORAGE_BACKEND: local
        run: python scripts/run_worker_checks.py
      - name: Build independent worker from canonical source
        run: docker build -f apps/worker/Dockerfile -t search-sphere-worker:ci apps/api
      - name: Verify hosted-only worker image without network
        run: >-
          docker run --rm --network none --memory 512m
          -e ENVIRONMENT=test -e STORAGE_BACKEND=local -e PYTHONPATH=/app
          -e DATABASE_URL=postgresql+asyncpg://synthetic:synthetic@localhost/search_sphere_test
          -v "$PWD/scripts/check_hosted_image.py:/check_hosted_image.py:ro"
          search-sphere-worker:ci python /check_hosted_image.py

  frontend-test:
    name: Frontend Lint, Test & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: "apps/web/pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install

      - name: Lint Frontend
        run: pnpm lint

      - name: Run Frontend Tests
        run: pnpm test

      - name: Build Next.js Web App
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-supabase-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "mock_publishable_key"
        run: pnpm build
