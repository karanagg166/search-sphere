[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "search-sphere-client"
version = "0.1.0"
description = "Python Client SDK for Search-Sphere Multi-Tenant RAG Microservice"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]
